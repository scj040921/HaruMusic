name: Windows build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json (without v)
        required: true
        type: string
      publish:
        description: Publish a GitHub Release after checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $env:REQUESTED_VERSION) { throw "Requested version does not match package.json" }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Expected a three-part version" }
      - run: npm ci
      # Vite generates the auto-import and component declaration files used by vue-tsc.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint:i18n
      - run: npm test
      - run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - run: node scripts/prepare-update-metadata.cjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: harumusic-windows-${{ inputs.version }}
          if-no-files-found: error
          path: |
            dist/HaruMusic-*-win-x64.exe
            dist/HaruMusic-*-win-x64.exe.blockmap
            dist/latest.yml

  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: harumusic-windows-${{ inputs.version }}
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          tag="v${REQUESTED_VERSION}"
          notes=".github/release-notes/${tag}.md"
          test -f "$notes" || { echo "Release notes are required: $notes"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release already exists"; exit 1; fi
          gh release create "$tag" release-assets/* --target "$RELEASE_TARGET" --title "HaruMusic ${REQUESTED_VERSION}" --notes-file "$notes"
